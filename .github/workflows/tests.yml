name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: outcome_sdk_sidecar/package-lock.json
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci
        working-directory: outcome_sdk_sidecar
      - run: npm run build
        working-directory: outcome_sdk_sidecar
      - run: python -m pytest -q
